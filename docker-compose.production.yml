# ==============================================================================
# GovAI Resolve — Single-Instance Production Docker Compose
# ==============================================================================
# Architecture:
# - backend: Node.js 20 Express + Socket.IO API server with persistent volume
# - frontend: Nginx serving Vite production SPA with reverse proxy for /api & WebSockets
# - evidence-uploads: Named volume ensuring uploaded evidence survives container lifecycles
#
# Production Usage:
#   docker compose -f docker-compose.production.yml up -d --build
# ==============================================================================

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - EVIDENCE_UPLOAD_DIR=/app/uploads
      - TRUST_PROXY=1
    volumes:
      - evidence-uploads:/app/uploads
    ports:
      # Bind to localhost to prevent direct public exposure, routing external traffic through Nginx
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - govai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - govai-network

volumes:
  evidence-uploads:
    name: govai-evidence-uploads

networks:
  govai-network:
    name: govai-network
